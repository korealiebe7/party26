<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f0">
  <meta name="description" content="산들의 세 가지 착장을 360도 영상과 구성 사진으로 살펴보세요.">
  <title>산들 | 360° 룩북</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="lookbook.css">
  <script src="lookbook.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <div class="identity" aria-label="산들 360도 룩북">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">산들</span>
        <span class="brand-section">360° 룩북</span>
      </div>
      <button class="sound-toggle" type="button" aria-pressed="false" hidden>
        <span class="sound-icon" aria-hidden="true"></span><span id="sound-label">전환음 꺼짐</span>
      </button>
    </div>
  </header>

  <main class="shell layout">
    <section class="viewer" aria-label="착장 미리보기">
      <div class="stage" id="stage" data-mode="video" data-state="loading">
        <div class="stage-picture">
          <img id="poster" class="poster" src="assets/01-poster.webp" width="540" height="960" alt="" fetchpriority="high">
          <video id="look-video" class="model-video" muted playsinline loop preload="auto" aria-hidden="true"></video>
          <img id="flatlay" class="flatlay" alt="" hidden>
        </div>
        <span class="stage-badge" id="media-badge">360°</span>
        <div id="scrubber" class="scrubber" role="slider" tabindex="0" aria-label="착장 영상 각도" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="영상의 0%" aria-describedby="drag-hint" hidden></div>
        <div class="stage-hint" id="drag-hint">
          <span class="drag-arrow" aria-hidden="true">↔</span> 좌우로 밀어 돌려보기
        </div>
        <div class="media-feedback" id="media-feedback" hidden>
          <p id="media-status" role="status"></p>
          <button type="button" id="retry-video" hidden>다시 시도</button>
        </div>
        <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
      </div>
      <div class="viewer-controls">
        <div class="mode-controls" role="group" aria-label="보는 방식">
          <button class="mode-button" type="button" data-mode="video" aria-pressed="true">착장 영상</button>
          <button class="mode-button" type="button" data-mode="photo" aria-pressed="false">구성 사진</button>
        </div>
        <button class="play-button" type="button" id="play-button" aria-label="착장 영상 재생" disabled>
          <i class="play-icon" aria-hidden="true"></i><span id="play-label">재생</span>
        </button>
      </div>
    </section>

    <div class="editorial">
      <nav class="look-nav" aria-labelledby="select-title">
        <div class="section-line">
          <h2 id="select-title">착장 선택</h2>
          <span id="look-count" aria-hidden="true">01 / 03</span>
        </div>
        <div class="look-list" id="look-list"></div>
      </nav>
      <section class="look-info" aria-labelledby="look-title">
        <div class="look-category" id="look-category">도시형 카고 스타일</div>
        <h1 id="look-title" aria-live="polite">산들 코어</h1>
        <p id="look-description" class="look-description"></p>
        <ul id="look-colors" class="look-colors" aria-label="착장 색상"></ul>
      </section>
      <div class="product-dock">
        <button class="products-trigger" type="button" id="products-trigger" aria-haspopup="dialog" disabled>
          <span id="products-trigger-label">이 착장의 제품 5개 보기</span>
          <span class="plus-icon" aria-hidden="true"></span>
        </button>
      </div>
      <noscript><p>착장을 선택하고 영상을 보려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
    </div>
  </main>

  <dialog class="product-sheet" id="product-sheet" aria-labelledby="sheet-title">
    <div class="sheet-content">
      <div class="sheet-head">
        <div>
          <button type="button" class="sheet-back" id="sheet-back" hidden>제품 목록</button>
          <p id="sheet-caption" class="sheet-caption"></p>
          <h2 id="sheet-title"></h2>
        </div>
        <button class="close-button" type="button" id="sheet-close" aria-label="제품 창 닫기" autofocus></button>
      </div>
      <div class="sheet-scroll" id="sheet-scroll">
        <ul class="product-grid" id="product-grid"></ul>
        <figure id="product-detail" class="product-detail" hidden>
          <img id="product-image" alt="">
        </figure>
      </div>
    </div>
  </dialog>
</body>
</html>
